<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen · Monitoring Circulaire Stad</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121316);--ink:light-dark(#16181d,#e9eaec);--mut:light-dark(#62666f,#a0a4ad);--rule:light-dark(#e3e4e7,#2c2e33);--acc:light-dark(#1f5fbf,#80aaff);--bad:light-dark(#a3271f,#ff8a80)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:360px}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
p{margin:0 0 20px;color:var(--mut)}
label{display:block;font-size:14px;font-weight:600;margin:0 0 4px}
input{width:100%;font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:10px;min-height:44px}
button{width:100%;margin-top:14px;font:inherit;font-size:15px;min-height:44px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.fout{color:var(--bad);margin:0 0 14px}
</style>
</head>
<body>
<main>
<h1>Monitoring Omgevingsprogramma Circulaire Stad</h1>
<p>Log in om de monitoring te bekijken en bij te werken.</p>
<!--FOUT-->
<form method="post" action="/login">
<input type="text" name="username" value="circulair" autocomplete="username" hidden>
<label for="wachtwoord">Wachtwoord</label>
<input id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" required autofocus>
<button type="submit">Inloggen</button>
</form>
</main>
</body>
</html>
