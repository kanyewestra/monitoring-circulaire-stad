services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_USER: ${APP_USER:-circulair}
      APP_PASSWORD: ${APP_PASSWORD:?Zet APP_PASSWORD in .env}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMEIN: ${DOMEIN:?Zet DOMEIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
